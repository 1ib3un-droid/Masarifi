<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14274E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ميزانيتي">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">

</head><body>
<title>ميزانيتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column (wider grid on iPad); money first, detail below; bars drawn in cells of colour, never in charts that can clip. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#EAEEF5;--line:#D9DFEA;--fg:#14274E;--muted:#5C6987;
  --navy:#14274E;--teal:#1F8A7D;--blue:#3A7BD5;--coral:#D9583A;--orange:#C9760F;--debt:#B83B5E;--purple:#7B61C9;
  --ok:#1F8A7D;--okbg:#DDF2EE;--warn:#B76A0B;--warnbg:#FFE9CC;--bad:#C62839;--badbg:#FBDDE0;--info:#2F66B8;--infobg:#DEEAFB;
  --input:#FFF4CF;--inputline:#E6CF78;--shadow:0 1px 2px rgba(20,39,78,.08),0 6px 18px rgba(20,39,78,.06);
  --font:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --disp:"Readex Pro","IBM Plex Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1424;--surface:#16213A;--surface2:#1E2B4A;--line:#2B3A5E;--fg:#EAF0FB;--muted:#9AA9C9;
  --navy:#0A1226;--teal:#47C2B2;--blue:#6AA2F0;--coral:#F08466;--orange:#F4A94E;--debt:#E5769A;--purple:#A18DEB;
  --ok:#5ED0C0;--okbg:#14403B;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF7A88;--badbg:#4B1D26;--info:#7FB0F5;--infobg:#1C3257;
  --input:#3A3414;--inputline:#7A6A22;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#16213A;--surface2:#1E2B4A;--line:#2B3A5E;--fg:#EAF0FB;--muted:#9AA9C9;
  --navy:#0A1226;--teal:#47C2B2;--blue:#6AA2F0;--coral:#F08466;--orange:#F4A94E;--debt:#E5769A;--purple:#A18DEB;
  --ok:#5ED0C0;--okbg:#14403B;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF7A88;--badbg:#4B1D26;--info:#7FB0F5;--infobg:#1C3257;
  --input:#3A3414;--inputline:#7A6A22;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;text-wrap:balance}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:8px 6px;margin-inline:-16px;padding-inline:16px}
.titlebar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.titlebar h1{font-size:1.35rem}
.yearbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.yearbox button{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:1.2rem;color:var(--fg)}
.yearbox button:active{background:var(--surface2)}
.yearbox b{min-width:52px;text-align:center;font-family:var(--disp)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:64px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;text-align:center;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:.72rem}
.chip b{font-family:var(--disp);font-size:.95rem}
.chip.dot::after{content:"";display:block;height:4px;border-radius:2px;background:var(--teal);margin-top:4px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on small{color:#ffffffcc}
.chip.on.dot::after{background:#fff}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px}
.card{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card .lab{font-size:.82rem;color:var(--muted);font-weight:600}
.card .val{font-family:var(--disp);font-size:1.5rem;font-weight:700;margin-block:2px;overflow-wrap:anywhere}
.card .sub{font-size:.78rem;color:var(--muted)}
.card.hero{grid-column:1/-1;background:var(--navy);color:#fff;border-color:transparent}
.card.hero .lab,.card.hero .sub{color:#ffffffbb}
.card.hero .val{font-size:2rem}
.card.neg .val{color:var(--bad)}
.card.hero.neg .val{color:#FFB3BB}
.trend{font-weight:700;font-size:.8rem}
.trend.up{color:var(--bad)}.trend.down{color:var(--ok)}
.card.hero .trend.up{color:#FFB3BB}.card.hero .trend.down{color:#8FE8DA}
.salbtn{border:1px dashed var(--inputline);background:var(--input);border-radius:10px;padding:2px 10px;font-size:.78rem;margin-top:4px}
/* sections */
.sec{margin-block:22px 0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sechead h2{font-size:1.1rem}
.sechead small{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.8rem;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1.5px solid var(--inputline);background:var(--input);padding:0 12px;width:100%;min-width:0}
.fld textarea{height:130px;padding:10px 12px;font-size:.8rem;direction:ltr;text-align:left}
.fld input.plain,.fld select.plain{background:var(--surface);border-color:var(--line)}
.fld input[inputmode=decimal],.fld input[type=number]{font-variant-numeric:tabular-nums}
.btn{height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;background:var(--blue);color:#fff;white-space:nowrap}
.btn.teal{background:var(--teal);color:#fff}.btn.coral{background:var(--coral);color:#fff}.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{height:36px;padding:0 12px;font-size:.85rem}
.btn.armed{background:var(--bad);color:#fff}
.btn:active{filter:brightness(.92)}
.pad{padding:14px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>.fld{flex:1 1 130px}
/* items */
.irow{padding:12px 14px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.ihead{display:flex;align-items:center;gap:8px}
.ihead b{flex:1;min-width:0;overflow-wrap:anywhere}
.dotc{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.pill{font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.near{background:var(--warnbg);color:var(--warn)}
.pill.over,.pill.hit,.pill.late{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.pill.paid{background:var(--okbg);color:var(--ok)}.pill.due{background:var(--warnbg);color:var(--warn)}
.bar{height:22px;border-radius:8px;background:var(--surface2);margin-block:8px 6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--blue);min-width:0;transition:width .35s ease}
.bar.ok i{background:var(--teal)}.bar.near i{background:var(--orange)}.bar.over i,.bar.hit i{background:var(--bad)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;padding-inline:10px;font-size:.78rem;font-weight:700;color:#fff;mix-blend-mode:normal}
.inums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.inums b{color:var(--fg)}
.limbtn{border:1px dashed var(--inputline);background:var(--input);border-radius:8px;padding:0 8px;font-size:.88rem}
.totrow{display:flex;justify-content:space-between;padding:12px 14px;background:var(--navy);color:#fff;font-weight:700}
/* log */
.entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm small{display:block;color:var(--muted);overflow-wrap:anywhere}
.entry .amt{font-family:var(--disp);font-weight:700}
.entry button{border:0;background:var(--surface2);border-radius:10px;width:40px;height:40px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.82rem}
.fchips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* debts */
.debt{padding:14px;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-block:10px}
.dgrid div{background:var(--surface2);border-radius:10px;padding:6px 10px;min-width:0}
.dgrid small{display:block;color:var(--muted);font-size:.72rem}
.dgrid b{font-family:var(--disp);overflow-wrap:anywhere}
.payrow{display:flex;gap:8px;align-items:flex-end}
.payrow .fld{flex:1}
/* month column chart */
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:200px;padding:28px 12px 0}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.col i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--coral);min-height:0}
.col em{font-style:normal;font-size:.62rem;font-weight:700;margin-bottom:3px;white-space:nowrap}
.colx{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:6px 12px 12px}
.colx button{border:0;background:transparent;font-weight:700;font-size:.8rem;color:var(--muted);padding:4px 0}
/* table-ish summary */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tblw{overflow-x:auto}
.tbl th{background:var(--navy);color:#fff;font-weight:600;padding:8px 10px;white-space:nowrap;text-align:center;font-size:.8rem}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl td:first-child{text-align:right;font-weight:700}
.tbl tr.tot td{background:var(--surface2);font-weight:800}
.tbl td.neg{color:var(--bad);font-weight:700}
.linkb{border:0;background:transparent;color:var(--blue);font-weight:700;padding:0;text-decoration:underline}
/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:820px}
.nav button{flex:1;border:0;background:transparent;padding:8px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue)}
/* misc */
.banner{background:var(--infobg);color:var(--info);border-radius:14px;padding:10px 14px;margin-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:60;font-weight:700;box-shadow:0 8px 30px #0005}
.modalbg{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.modal h3{margin-bottom:12px}
.modal .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .acts .btn{flex:1}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lock input{width:220px;height:56px;text-align:center;font-size:1.6rem;letter-spacing:.4em;border-radius:14px;border:2px solid var(--inputline);background:var(--input)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
@media (max-width:420px){.card .val{font-size:1.3rem}.card.hero .val{font-size:1.7rem}.titlebar h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* current month bar + inbox */
.curbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-block:10px;box-shadow:var(--shadow)}
.curtxt small{display:block;color:var(--muted);font-size:.76rem}
.curtxt b{font-family:var(--disp);font-size:1.15rem}
.tx{padding:12px 14px;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx.dup{background:var(--warnbg)}
.txh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.txh .amt{font-family:var(--disp);font-size:1.35rem}
.txh .mer{font-weight:700;overflow-wrap:anywhere;flex:1;min-width:0}
.txh .when{color:var(--muted);font-size:.78rem}
.txp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.txm{font-size:.84rem;color:var(--muted);margin-top:6px}
.tx.dup .txm{color:var(--warn)}
.txchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.txchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;min-height:36px}
.txchips button:active{background:var(--surface2)}
.txchips button.sug{background:var(--teal);border-color:var(--teal);color:#fff}
.txa{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.txfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line)}
.donelist{border-top:1px solid var(--line)}
.nav button{position:relative}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;min-width:18px;height:18px;padding-inline:4px;font-size:.68rem;line-height:18px;text-align:center;font-style:normal;font-weight:800}

.setitem{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.setitem:last-of-type{border-bottom:0;margin-bottom:6px}
.nmrow{grid-column:1/-1;display:flex;gap:8px;align-items:center}

.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--surface2);font-size:.82rem;font-weight:700;color:var(--muted);border-top:1px solid var(--line)}
.dayh:first-child{border-top:0}
.dayh span{color:var(--fg)}

</style>
<div id="root"></div>
<script>
/* ===== CORE (pure logic, no DOM) ===== */
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ITEM_DEFAULTS=['الأكل','القهوة','البنزين','البقالة','الصيدلية','العائلة','الاستثمار','مكملات النادي','أخرى','الإنترنت'];
const ITEM_COLORS=['#E76F51','#9C6B4E','#F4A261','#2A9D8F','#3A7BD5','#D96FA0','#7B61C9','#4CB5A0','#8D99AE','#C9A227'];
const FIXED_NAMES=['العائلة','الاستثمار','الإنترنت'];
const kindByName=n=>FIXED_NAMES.includes(String(n).trim())?'fixed':'daily';
const KIND_LABEL={buy:'شراء',trf:'تحويل',intl:'تحويل دولي',own:'بين حساباتك',unk:'غير معروف'};
const DUP_MIN=30, KEEP_DONE_DAYS=7;
const DEBT_COLOR='#B83B5E';
const EPS=0.005;
const mi=(y,m)=>y*12+(m-1);
const fromMi=i=>({y:Math.floor(i/12),m:(i%12+12)%12+1});
function num(s){
  if(typeof s==='number') return isFinite(s)?s:0;
  s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫]/g,'.').replace(/[٬,\s]/g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function nowCur(d){d=d||new Date();return {y:d.getFullYear(),m:d.getMonth()+1};}
function defState(d){
  return {v:1,settings:{salary:0,items:ITEM_DEFAULTS.map((n,i)=>({id:'i'+i,name:n,limit:0,kind:kindByName(n)})),pin:null,lastBackup:0,
          cur:nowCur(d),curPrev:null,curSince:0,mig:2},
          years:{},debts:[],planned:[],inbox:[],learn:{}};
}
function getMonth(S,y,m,create){
  let Y=S.years[y]; if(!Y){ if(!create) return null; Y=S.years[y]={months:{}}; }
  let M=Y.months[m]; if(!M){ if(!create) return null; M=Y.months[m]={salary:null,limits:{},log:[]}; }
  return M;
}
/* ---- debts ---- */
function sched(d,i){
  const s=mi(d.startY,d.startM); if(i<s) return 0;
  if(d.type==='cash') return d.amount;
  const n=Math.max(1,d.n||1); return d.amount*Math.min(i-s+1,n)/n;
}
function paidBefore(d,i){let t=0; for(const k in d.pay){ if(+k<i) t+=d.pay[k]; } return t;}
function paidTotal(d){let t=0; for(const k in d.pay) t+=d.pay[k]; return t;}
function debtRow(d,i){
  const start=mi(d.startY,d.startM);
  const PB=paidBefore(d,i), Q=sched(d,i), R=sched(d,i-1);
  const late=Math.max(0,R-PB), due=Math.max(0,Q-PB);
  const remStart=d.amount-PB, paid=d.pay[i]||0, remAfter=remStart-paid;
  const installment=d.type==='cash'?d.amount:d.amount/Math.max(1,d.n||1);
  let status;
  if(remStart<=EPS) status='مكتمل';
  else if(i<start) status='يبدأ';
  else if(PB+paid>=Q-EPS) status='مسدد';
  else if(PB+paid<R-EPS) status='متأخر';
  else status='مستحق';
  const visible=remStart>EPS;
  const dueAfter=Math.max(0,Q-PB-paid);
  const monthsLeft=d.type==='cash'?(remAfter>EPS?1:0):Math.max(0,Math.ceil(remAfter/installment-1e-9));
  return {d,i,start,PB,Q,R,late,due,remStart,paid,remAfter,installment,status,visible,dueAfter,monthsLeft};
}
/* ---- planned purchases ---- */
function plannedAt(S,i){
  const out=[];
  for(const p of S.planned){
    if(i<p.mi) continue;

function parseSms(text,opt){

  if(/المستفيد|beneficiary/i.test(flat)) return {ok:false,reason:'beneficiary'};

function fmtClock(ms){const d=new Date(ms),h=d.getHours();return (h%12||12)+':'+String(d.getMinutes()).padStart(2,'0')+' '+(h>=12?'م':'ص');}

function txCard(t){
  const dup=dupOf(S,t), sug=suggestFor(S,t), wallet=t.flags.includes('wallet'), own=t.kind==='own', unp=t.flags.includes('unparsed');
  const special=(wallet||own)&&!unp, open=!special||ui.open[t.id];
  const w=new Date(t.ts), when=w.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · '+w.getDate()+'/'+(w.getMonth()+1);
  let pills='';
  if(t.kind!=='buy') pills+=`<span class="pill info">${esc(KIND_LABEL[t.kind])}${t.note?' · '+esc(t.note):''}</span>`;
  if(wallet) pills+='<span class="pill due">تعبئة محفظة</span>';
  if(t.fee>0) pills+=`<span class="pill">منها رسوم ${fmt(t.fee)}</span>`;

  if(t.mo) pills+=`<span class="pill info">لشهر ${mname(t.mo.m)}</span>`;
  let msg='';
  if(unp) msg=`ما انفهمت الرسالة${t.hint?': '+esc(t.hint):''}. اضغط ✎ واكتب المبلغ.`;
  else if(wallet) msg='هذي إضافة أموال لمحفظة برق (تحويل بين حساباتك). تجاهلها أو أضفها.';
  else if(own) msg='حوالة بين حساباتك، ما تُحسب مصروف إلا لو أضفتها.';
  if(dup) msg+=`${msg?'<br>':''}مشابهة لعملية${dup.merchant?' من '+esc(dup.merchant):''} (${fmt(dup.amt)}) ${Math.round(Math.abs(t.ts-dup.ts)/60000)<1?'في نفس الدقيقة':'بفارق '+Math.round(Math.abs(t.ts-dup.ts)/60000)+' دقيقة'}، ${dup.st==='done'?'وتم تصنيفها':'وهي بانتظار التصنيف'}. أضفها لو هي عملية ثانية فعلاً، أو تجاهلها.`;

    h+=`<div class="debt"><div class="ihead"><b>${esc(p.name)}</b><span class="num"><b>${fmt(p.amt)}</b></span></div>
    ${x.carried?`<div class="note" style="margin:2px 0">مؤجل من ${x.times===1?'شهر':x.times+' أشهر'}</div>`:''}${p.note?`<div class="note" style="margin:2px 0">${esc(p.note)}</div>`:''}
    <div class="row" style="margin-top:8px;gap:8px">${[['done','تم','teal'],['postponed','مؤجل','coral'],['cancelled','ما تم','ghost']].map(([k,l,cl])=>`<button class="btn sm ${x.status===k?cl:'ghost'}" style="${x.status===k?'':'opacity:.75'}" data-act="plst" data-id="${p.id}" data-st="${k}">${x.status===k?'● ':''}${l}</button>`).join('')}<button class="btn sm ghost" data-act="plEdit" data-id="${p.id}">تعديل</button></div></div>`;
  }
  h+=`<div class="pad" style="border-top:1px solid var(--line)"><form data-form="addPl"><div class="row"><div class="fld" style="flex:2 1 160px"><label for="pl_n">اسم المشترى</label><input id="pl_n" name="name" required autocomplete="off"></div><div class="fld"><label for="pl_a">المبلغ التقريبي</label><input id="pl_a" name="amt" inputmode="decimal" autocomplete="off" required></div><div class="fld" style="flex:2 1 160px"><label for="pl_t">ملاحظة</label><input id="pl_t" name="note" autocomplete="off"></div><button class="btn" type="submit">إضافة</button></div></form></div></div>
  <p class="note">«مؤجل» ينتقل تلقائياً للشهر التالي. «تم» و«ما تم» يوقفانه. لا يُخصم المبلغ إلا إذا سجّلته في المصاريف.</p></div>`;

  // log: newest first, grouped by day, each line shows the purchase time
  const M=c.M, log=[...M.log].sort((a,b)=>entryTime(b)-entryTime(a));
  const used=S.settings.items.filter(i=>M.log.some(e=>e.item===i.id));
  h+=`<div class="sec"><div class="sechead"><h2>سجل المصاريف</h2><small>${M.log.length} عملية</small></div><div class="panel">`;
  if(used.length>1) h+=`<div class="fchips"><button class="${ui.filter?'':'on'}" data-act="filter" data-id="">الكل</button>${used.map(i=>`<button class="${ui.filter===i.id?'on':''}" data-act="filter" data-id="${i.id}">${esc(i.name)}</button>`).join('')}</div>`;
  const shown=log.filter(e=>!ui.filter||e.item===ui.filter);
  if(!shown.length) h+='<div class="empty">ما فيه مصاريف مسجلة. أضف أول مصروف من الأعلى.</div>';
  let curDay=null;
  for(const e of shown){const it=S.settings.items.find(i=>i.id===e.item);const idx=S.settings.items.indexOf(it);const t=entryTime(e),dk=dayStart(t);
    if(dk!==curDay){curDay=dk;const tot=r2(shown.filter(z=>dayStart(entryTime(z))===dk).reduce((a,z)=>a+z.amt,0));
      h+=`<div class="dayh"><b>${esc(dayLabel(t))}</b><span>${N(tot)}</span></div>`;}
    h+=`<div class="entry"><span class="dotc" style="background:${it?ITEM_COLORS[idx%ITEM_COLORS.length]:'#999'}"></span><div class="nm"><b>${esc(it?it.name:'بند محذوف')}</b><small>${fmtClock(t)}${e.note?' · '+esc(e.note):''}</small></div><span class="amt">${N(e.amt)}</span><button data-act="editExp" data-id="${e.id}" aria-label="تعديل">✎</button></div>`;}
  return h+'</div></div>';
}

    else f+=`<div class="fld"><label for="m_${x.name}">${x.label}</label><input id="m_${x.name}" name="${x.name}" ${x.type?`type="${x.type}" dir="ltr"`:''} ${x.inputmode?`inputmode="${x.inputmode}"`:''} value="${esc(x.value)}" placeholder="${esc(x.ph||'')}" ${x.required?'required':''} autocomplete="off"></div>`;

function render(keepTop){
  const root=document.getElementById('root'); const sy=window.scrollY;
  if(ui.locked){root.innerHTML=`<div class="lock"><h1>ميزانيتي</h1><p class="muted">اكتب رمز الدخول</p><form data-form="unlock"><input id="lockin" name="pin" type="password" inputmode="numeric" autocomplete="off" autofocus aria-label="رمز الدخول"><div style="margin-top:12px"><button class="btn" type="submit">فتح</button></div></form>${ui.lockErr?'<p style="color:var(--bad);font-weight:700">الرمز غير صحيح</p>':''}</div>`;return;}
  const body={summary:vSummary,month:vMonth,debts:vDebts,settings:vSettings}[ui.tab]();
  const pc=pendingCount();
  const nav=['summary','month','debts','settings'].map(t=>`<button class="${ui.tab===t?'on':''}" data-act="tab" data-v="${t}">${icons[t]}<span>${{summary:'الملخص',month:'الشهر',debts:'الديون',settings:'الإعدادات'}[t]}</span>${t==='month'&&pc>0?`<i class="badge" aria-label="${pc} عملية بانتظار التصنيف">${pc}</i>`:''}</button>`).join('');
  root.innerHTML=`<div class="app">${topbar()}${body}</div><nav class="nav" aria-label="التنقل"><div>${nav}</div></nav>${modalHtml()}${ui.toast?`<div class="toast" role="status">${esc(ui.toast)}</div>`:''}`;
  window.scrollTo(0,keepTop?0:sy);
  const ch=document.querySelector('.chip.on'); if(ch&&ch.scrollIntoView&&ui.tab==='month'){const c=document.getElementById('chips');if(c){c.scrollLeft+=ch.getBoundingClientRect().left-c.getBoundingClientRect().left-c.clientWidth/2+ch.clientWidth/2;}}
  if(ui.focus){const e=document.getElementById(ui.focus);if(e)e.focus();ui.focus=null;}
}

/* ---------- bank-message intake (from the iPhone Shortcut: ...#sms=<message text>&src=rajhi|barq) ---------- */
async function intake(){
  const h=location.hash.replace(/^#/,''); if(!h) return;
  let p; try{p=new URLSearchParams(h);}catch(e){return;}
  if(!p.has('sms')&&!p.has('a')) return;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}   // the message text must not stay in the address bar
  let r;
  if(p.has('sms')) r=parseSms(p.get('sms'),{src:p.get('src')||''});
  else{const a=num(p.get('a'));const k=['buy','trf','intl','own'].includes(p.get('k'))?p.get('k'):'buy';
    r=a>0?{ok:true,tx:{id:uid(),ts:Date.now(),arr:Date.now(),amt:r2(a),merchant:String(p.get('m')||'').slice(0,60),note:'',kind:k,fee:0,flags:[],src:'',hint:'',st:'pending',upd:Date.now(),ref:null,mo:null}}:{ok:false,reason:'irrelevant'};
    if(r.ok&&k==='buy'&&/^barq\b/i.test(r.tx.merchant))r.tx.flags.push('wallet');}
  ui.tab='month';const c=S.settings.cur;ui.y=c.y;ui.m=c.m;
  if(!r.ok){render(true);toast('تم تجاهل الرسالة: '+(REASON_AR[r.reason]||''));return;}
  const cloudOn=typeof Cloud!=='undefined'&&Cloud.active();
  if(cloudOn) await Cloud.whenIdle(12000);   // make sure this page is up to date before adding to it
  S.inbox.push(r.tx); ui.intakeWarn=!cloudOn; save(); render(true);
  toast('وصلت عملية: '+(r.tx.amt>0?fmt(r.tx.amt):'؟')+(r.tx.merchant?' · '+r.tx.merchant:''));
}
