<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14274E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ميزانيتي">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head><body>
<title>ميزانيتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column (wider grid on iPad); money first, detail below; bars drawn in cells of colour, never in charts that can clip. */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#EAEEF5;--line:#D9DFEA;--fg:#14274E;--muted:#5C6987;
  --navy:#14274E;--teal:#1F8A7D;--blue:#3A7BD5;--coral:#D9583A;--orange:#C9760F;--debt:#B83B5E;--purple:#7B61C9;
  --ok:#1F8A7D;--okbg:#DDF2EE;--warn:#B76A0B;--warnbg:#FFE9CC;--bad:#C62839;--badbg:#FBDDE0;--info:#2F66B8;--infobg:#DEEAFB;
  --input:#FFF4CF;--inputline:#E6CF78;--shadow:0 1px 2px rgba(20,39,78,.08),0 6px 18px rgba(20,39,78,.06);
  --font:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --disp:"Readex Pro","IBM Plex Sans Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1424;--surface:#16213A;--surface2:#1E2B4A;--line:#2B3A5E;--fg:#EAF0FB;--muted:#9AA9C9;
  --navy:#0A1226;--teal:#47C2B2;--blue:#6AA2F0;--coral:#F08466;--orange:#F4A94E;--debt:#E5769A;--purple:#A18DEB;
  --ok:#5ED0C0;--okbg:#14403B;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF7A88;--badbg:#4B1D26;--info:#7FB0F5;--infobg:#1C3257;
  --input:#3A3414;--inputline:#7A6A22;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424;--surface:#16213A;--surface2:#1E2B4A;--line:#2B3A5E;--fg:#EAF0FB;--muted:#9AA9C9;
  --navy:#0A1226;--teal:#47C2B2;--blue:#6AA2F0;--coral:#F08466;--orange:#F4A94E;--debt:#E5769A;--purple:#A18DEB;
  --ok:#5ED0C0;--okbg:#14403B;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF7A88;--badbg:#4B1D26;--info:#7FB0F5;--infobg:#1C3257;
  --input:#3A3414;--inputline:#7A6A22;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;text-wrap:balance}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:8px 6px;margin-inline:-16px;padding-inline:16px}
.titlebar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.titlebar h1{font-size:1.35rem}
.yearbox{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px}
.yearbox button{border:0;background:transparent;width:40px;height:40px;border-radius:10px;font-size:1.2rem;color:var(--fg)}
.yearbox button:active{background:var(--surface2)}
.yearbox b{min-width:52px;text-align:center;font-family:var(--disp)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:64px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;text-align:center;line-height:1.2}
.chip small{display:block;color:var(--muted);font-size:.72rem}
.chip b{font-family:var(--disp);font-size:.95rem}
.chip.dot::after{content:"";display:block;height:4px;border-radius:2px;background:var(--teal);margin-top:4px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on small{color:#ffffffcc}
.chip.on.dot::after{background:#fff}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px}
.card{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card .lab{font-size:.82rem;color:var(--muted);font-weight:600}
.card .val{font-family:var(--disp);font-size:1.5rem;font-weight:700;margin-block:2px;overflow-wrap:anywhere}
.card .sub{font-size:.78rem;color:var(--muted)}
.card.hero{grid-column:1/-1;background:var(--navy);color:#fff;border-color:transparent}
.card.hero .lab,.card.hero .sub{color:#ffffffbb}
.card.hero .val{font-size:2rem}
.card.neg .val{color:var(--bad)}
.card.hero.neg .val{color:#FFB3BB}
.trend{font-weight:700;font-size:.8rem}
.trend.up{color:var(--bad)}.trend.down{color:var(--ok)}
.card.hero .trend.up{color:#FFB3BB}.card.hero .trend.down{color:#8FE8DA}
.salbtn{border:1px dashed var(--inputline);background:var(--input);border-radius:10px;padding:2px 10px;font-size:.78rem;margin-top:4px}
/* sections */
.sec{margin-block:22px 0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sechead h2{font-size:1.1rem}
.sechead small{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.8rem;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{height:46px;border-radius:12px;border:1.5px solid var(--inputline);background:var(--input);padding:0 12px;width:100%;min-width:0}
.fld textarea{height:130px;padding:10px 12px;font-size:.8rem;direction:ltr;text-align:left}
.fld input.plain,.fld select.plain{background:var(--surface);border-color:var(--line)}
.fld input[inputmode=decimal],.fld input[type=number]{font-variant-numeric:tabular-nums}
.btn{height:46px;border-radius:12px;border:0;padding:0 18px;font-weight:700;background:var(--blue);color:#fff;white-space:nowrap}
.btn.teal{background:var(--teal);color:#fff}.btn.coral{background:var(--coral);color:#fff}.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{height:36px;padding:0 12px;font-size:.85rem}
.btn.armed{background:var(--bad);color:#fff}
.btn:active{filter:brightness(.92)}
.pad{padding:14px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>.fld{flex:1 1 130px}
/* items */
.irow{padding:12px 14px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.ihead{display:flex;align-items:center;gap:8px}
.ihead b{flex:1;min-width:0;overflow-wrap:anywhere}
.dotc{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.pill{font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.near{background:var(--warnbg);color:var(--warn)}
.pill.over,.pill.hit,.pill.late{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.pill.paid{background:var(--okbg);color:var(--ok)}.pill.due{background:var(--warnbg);color:var(--warn)}
.bar{height:22px;border-radius:8px;background:var(--surface2);margin-block:8px 6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--blue);min-width:0;transition:width .35s ease}
.bar.ok i{background:var(--teal)}.bar.near i{background:var(--orange)}.bar.over i,.bar.hit i{background:var(--bad)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;padding-inline:10px;font-size:.78rem;font-weight:700;color:#fff;mix-blend-mode:normal}
.inums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.inums b{color:var(--fg)}
.limbtn{border:1px dashed var(--inputline);background:var(--input);border-radius:8px;padding:0 8px;font-size:.88rem}
.totrow{display:flex;justify-content:space-between;padding:12px 14px;background:var(--navy);color:#fff;font-weight:700}
/* log */
.entry{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .nm{flex:1;min-width:0}
.entry .nm small{display:block;color:var(--muted);overflow-wrap:anywhere}
.entry .amt{font-family:var(--disp);font-weight:700}
.entry button{border:0;background:var(--surface2);border-radius:10px;width:40px;height:40px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.fchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.82rem}
.fchips button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* debts */
.debt{padding:14px;border-top:1px solid var(--line)}
.debt:first-child{border-top:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-block:10px}
.dgrid div{background:var(--surface2);border-radius:10px;padding:6px 10px;min-width:0}
.dgrid small{display:block;color:var(--muted);font-size:.72rem}
.dgrid b{font-family:var(--disp);overflow-wrap:anywhere}
.payrow{display:flex;gap:8px;align-items:flex-end}
.payrow .fld{flex:1}
/* month column chart */
.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:200px;padding:28px 12px 0}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.col i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--coral);min-height:0}
.col em{font-style:normal;font-size:.62rem;font-weight:700;margin-bottom:3px;white-space:nowrap}
.colx{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:6px 12px 12px}
.colx button{border:0;background:transparent;font-weight:700;font-size:.8rem;color:var(--muted);padding:4px 0}
/* table-ish summary */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tblw{overflow-x:auto}
.tbl th{background:var(--navy);color:#fff;font-weight:600;padding:8px 10px;white-space:nowrap;text-align:center;font-size:.8rem}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl td:first-child{text-align:right;font-weight:700}
.tbl tr.tot td{background:var(--surface2);font-weight:800}
.tbl td.neg{color:var(--bad);font-weight:700}
.linkb{border:0;background:transparent;color:var(--blue);font-weight:700;padding:0;text-decoration:underline}
/* nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:820px}
.nav button{flex:1;border:0;background:transparent;padding:8px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--blue)}
/* misc */
.banner{background:var(--infobg);color:var(--info);border-radius:14px;padding:10px 14px;margin-block:10px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;text-align:center;z-index:60;font-weight:700;box-shadow:0 8px 30px #0005}
.modalbg{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.modal h3{margin-bottom:12px}
.modal .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .acts .btn{flex:1}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.lock input{width:220px;height:56px;text-align:center;font-size:1.6rem;letter-spacing:.4em;border-radius:14px;border:2px solid var(--inputline);background:var(--input)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
@media (max-width:420px){.card .val{font-size:1.3rem}.card.hero .val{font-size:1.7rem}.titlebar h1{font-size:1.15rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<div id="root"></div>
<script>
/* ===== CORE (pure logic, no DOM) ===== */
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ITEM_DEFAULTS=['الأكل','القهوة','البنزين','البقالة','الصيدلية','العائلة','الاستثمار','مكملات النادي','أخرى'];
const ITEM_COLORS=['#E76F51','#9C6B4E','#F4A261','#2A9D8F','#3A7BD5','#D96FA0','#7B61C9','#4CB5A0','#8D99AE'];
const DEBT_COLOR='#B83B5E';
const EPS=0.005;
const mi=(y,m)=>y*12+(m-1);
const fromMi=i=>({y:Math.floor(i/12),m:(i%12+12)%12+1});
function num(s){
  if(typeof s==='number') return isFinite(s)?s:0;
  s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٫]/g,'.').replace(/[٬,\s]/g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function defState(){
  return {v:1,settings:{salary:0,items:ITEM_DEFAULTS.map((n,i)=>({id:'i'+i,name:n,limit:0})),pin:null,lastBackup:0},
          years:{},debts:[],planned:[]};
}
function getMonth(S,y,m,create){
  let Y=S.years[y]; if(!Y){ if(!create) return null; Y=S.years[y]={months:{}}; }
  let M=Y.months[m]; if(!M){ if(!create) return null; M=Y.months[m]={salary:null,limits:{},log:[]}; }
  return M;
}
/* ---- debts ---- */
function sched(d,i){
  const s=mi(d.startY,d.startM); if(i<s) return 0;
  if(d.type==='cash') return d.amount;
  const n=Math.max(1,d.n||1); return d.amount*Math.min(i-s+1,n)/n;
}
function paidBefore(d,i){let t=0; for(const k in d.pay){ if(+k<i) t+=d.pay[k]; } return t;}
function paidTotal(d){let t=0; for(const k in d.pay) t+=d.pay[k]; return t;}
function debtRow(d,i){
  const start=mi(d.startY,d.startM);
  const PB=paidBefore(d,i), Q=sched(d,i), R=sched(d,i-1);
  const late=Math.max(0,R-PB), due=Math.max(0,Q-PB);
  const remStart=d.amount-PB, paid=d.pay[i]||0, remAfter=remStart-paid;
  const installment=d.type==='cash'?d.amount:d.amount/Math.max(1,d.n||1);
  let status;
  if(remStart<=EPS) status='مكتمل';
  else if(i<start) status='يبدأ';
  else if(PB+paid>=Q-EPS) status='مسدد';
  else if(PB+paid<R-EPS) status='متأخر';
  else status='مستحق';
  const visible=remStart>EPS;
  const dueAfter=Math.max(0,Q-PB-paid);
  const monthsLeft=d.type==='cash'?(remAfter>EPS?1:0):Math.max(0,Math.ceil(remAfter/installment-1e-9));
  return {d,i,start,PB,Q,R,late,due,remStart,paid,remAfter,installment,status,visible,dueAfter,monthsLeft};
}
/* ---- planned purchases ---- */
function plannedAt(S,i){
  const out=[];
  for(const p of S.planned){
    if(i<p.mi) continue;
    let ok=true; for(let j=p.mi;j<i;j++){ if(p.st[j]!=='postponed'){ok=false;break;} }
    if(ok) out.push({p,status:p.st[i]||'pending',carried:i>p.mi,times:i-p.mi});
  }
  return out;
}
function plannedFinal(S,p){
  let j=p.mi; while(p.st[j]==='postponed') j++;
  return {endMi:j,status:p.st[j]||'pending',times:j-p.mi};
}
/* ---- month ---- */
function monthCalc(S,y,m){
  const M=getMonth(S,y,m,false)||{salary:null,limits:{},log:[]};
  const i=mi(y,m);
  const items=S.settings.items.map((it,k)=>{
    const spend=r2(M.log.filter(e=>e.item===it.id).reduce((a,e)=>a+e.amt,0));
    const cnt=M.log.filter(e=>e.item===it.id).length;
    const ov=M.limits[it.id];
    const limit=(ov!=null)?ov:(it.limit||0);
    const pct=limit>0?spend/limit:null;
    let st='none';
    if(limit>0){ if(spend>limit+EPS) st='over'; else if(spend>=limit-EPS&&spend>0) st='hit'; else if(pct>=0.8) st='near'; else st='ok'; }
    return {id:it.id,name:it.name,color:ITEM_COLORS[k],spend,cnt,limit,limitOverride:ov!=null,pct,st,left:limit>0?r2(limit-spend):null};
  });
  const orphan=r2(M.log.filter(e=>!S.settings.items.some(it=>it.id===e.item)).reduce((a,e)=>a+e.amt,0));
  const daily=r2(items.reduce((a,x)=>a+x.spend,0)+orphan);
  const debtRows=S.debts.map(d=>debtRow(d,i)).filter(r=>r.visible);
  const debtsPaid=r2(S.debts.reduce((a,d)=>a+(d.pay[i]||0),0));
  const total=r2(daily+debtsPaid);
  const hasSalaryOv=M.salary!=null;
  const salary=hasSalaryOv?M.salary:(S.settings.salary||0);
  const remaining=r2(salary-total);
  const active=total>EPS||hasSalaryOv;
  const maxSpend=Math.max(0,...items.map(x=>x.spend),debtsPaid);
  return {y,m,i,M,items,orphan,daily,debtRows,debtsPaid,total,salary,hasSalaryOv,remaining,active,
          pctLeft:salary>0?remaining/salary:0,maxSpend,
          dueTotal:r2(debtRows.reduce((a,r)=>a+r.dueAfter,0)),lateTotal:r2(debtRows.reduce((a,r)=>a+Math.max(0,r.late-r.paid),0))};
}
function prevMonth(y,m){return m===1?{y:y-1,m:12}:{y,m:m-1};}
function yearCalc(S,y){
  const months=[]; for(let m=1;m<=12;m++) months.push(monthCalc(S,y,m));
  const act=months.filter(x=>x.active);
  const sum=k=>r2(act.reduce((a,x)=>a+x[k],0));
  const itemTot=S.settings.items.map((it,k)=>({id:it.id,name:it.name,color:ITEM_COLORS[k],total:r2(months.reduce((a,x)=>a+x.items[k].spend,0))}));
  const debtsTot=sum('debtsPaid');
  const totalExp=sum('total');
  return {months,activeCount:act.length,salary:sum('salary'),daily:sum('daily'),debts:debtsTot,total:totalExp,remaining:r2(sum('salary')-totalExp),itemTot,
          maxMonth:Math.max(0,...months.map(x=>x.active?x.total:0))};
}
function lastActiveMi(S,fallbackMi){
  let best=null;
  for(const y in S.years) for(const m in S.years[y].months){
    const c=monthCalc(S,+y,+m); if(c.active){const i=mi(+y,+m); if(best==null||i>best) best=i;}
  }
  for(const d of S.debts){ for(const k in d.pay){ if(d.pay[k]>0){const i=+k; if(best==null||i>best) best=i;} } }
  return best==null?fallbackMi:best;
}
/* ---- validation of imported backups ---- */
function sanitize(o){
  if(!o||typeof o!=='object'||o.v!==1||!o.settings||!Array.isArray(o.settings.items)||!o.years||typeof o.years!=='object'||!Array.isArray(o.debts)||!Array.isArray(o.planned)) return null;
  const S=defState();
  S.settings.salary=num(o.settings.salary);
  S.settings.pin=typeof o.settings.pin==='string'?o.settings.pin:null;
  S.settings.lastBackup=num(o.settings.lastBackup);
  S.settings.items=o.settings.items.slice(0,20).map((it,k)=>({id:String(it.id||'i'+k),name:String(it.name||'بند').slice(0,40),limit:Math.max(0,num(it.limit))}));
  if(!S.settings.items.length) return null;
  for(const y in o.years){ const Y=o.years[y]; if(!Y||!Y.months) continue;
    for(const m in Y.months){ const M=Y.months[m]; if(!M) continue;
      const T=getMonth(S,+y,+m,true);
      T.salary=(M.salary==null||M.salary==='')?null:num(M.salary);
      for(const k in (M.limits||{})) T.limits[k]=Math.max(0,num(M.limits[k]));
      T.log=(Array.isArray(M.log)?M.log:[]).map(e=>({id:String(e.id||uid()),item:String(e.item),amt:num(e.amt),note:String(e.note||'').slice(0,200),ts:num(e.ts)||0}));
    } }
  S.debts=o.debts.map(d=>({id:String(d.id||uid()),name:String(d.name||'دين').slice(0,60),type:d.type==='cash'?'cash':'inst',amount:Math.max(0,num(d.amount)),n:Math.max(1,Math.round(num(d.n))||1),
     startY:Math.round(num(d.startY))||0,startM:Math.min(12,Math.max(0,Math.round(num(d.startM)))),note:String(d.note||'').slice(0,200),
     pay:Object.fromEntries(Object.entries(d.pay||{}).map(([k,v])=>[k,num(v)]).filter(([k,v])=>v>0))}));
  S.planned=o.planned.map(p=>({id:String(p.id||uid()),name:String(p.name||'').slice(0,80),amt:Math.max(0,num(p.amt)),note:String(p.note||'').slice(0,200),mi:Math.round(num(p.mi)),
     st:Object.fromEntries(Object.entries(p.st||{}).filter(([k,v])=>['done','postponed','cancelled'].includes(v)))}));
  return S;
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      try{const o=sanitize(JSON.parse(raw)); if(o) return o;}catch(e){}
      try{localStorage.setItem(KEY+'.corrupt',raw);}catch(e){}
    }
  }catch(e){memOnly=true;}
  return defState();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));saveErr=false;}catch(e){saveErr=true;}
}
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return 'f'+(h>>>0).toString(16);}
}
async function hashPin(pin){const salt=uid();return salt+':'+await sha(salt+pin);}
async function checkPin(pin,stored){const [salt,h]=stored.split(':');return (await sha(salt+pin))===h;}

  h+='</div></div>';

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='closeModal'&&e.target.closest('.modal')&&!b.closest('.acts')) return;

  const d=b.dataset;
  switch(d.act){
    case 'tab': ui.tab=d.v; if(d.v==='summary') ui.sumY=ui.y; render(true); break;
    case 'year': if(ui.tab==='summary'){ui.sumY+=+d.d;}else{ui.y+=+d.d;} render(); break;
    case 'month': ui.m=+d.m; ui.filter=null; render(); break;

        onSubmit:v=>{const M2=getMonth(S,ui.y,ui.m,true);M2.salary=String(v.v).trim()===''?null:Math.max(0,num(v.v));ui.modal=null;changed('تم حفظ الراتب');}}); break;}
    case 'editLimit': {const it=S.settings.items.find(i=>i.id===d.id);const M=getMonth(S,ui.y,ui.m,false);const ov=M&&M.limits[d.id];
      openModal({title:'حد '+esc(it.name)+' في '+mname(ui.m),fields:[{name:'v',label:'الحد لهذا الشهر فقط',inputmode:'decimal',value:ov!=null?ov:'',ph:'الافتراضي: '+(it.limit>0?fmt(it.limit):'بدون حد')}],note:'اتركه فارغاً للرجوع إلى الحد الافتراضي. اكتب 0 لبند بدون حد في هذا الشهر.',
        onSubmit:v=>{const M2=getMonth(S,ui.y,ui.m,true);if(String(v.v).trim()==='')delete M2.limits[d.id];else M2.limits[d.id]=Math.max(0,num(v.v));ui.modal=null;changed('تم حفظ الحد');}}); break;}
    case 'editExp': {const M=getMonth(S,ui.y,ui.m,false);const x=M.log.find(z=>z.id===d.id);
      openModal({title:'تعديل مصروف',fields:[{name:'item',label:'البند',type:'select',value:x.item,options:S.settings.items.map(i=>({v:i.id,l:i.name}))},{name:'amt',label:'المبلغ',inputmode:'decimal',value:x.amt,required:true},{name:'note',label:'تفاصيل',value:x.note}],
        extra:[{label:'حذف',cls:'bad',confirm:true,fn:()=>{M.log=M.log.filter(z=>z.id!==x.id);ui.modal=null;changed('تم الحذف');}}],
        onSubmit:v=>{const a=num(v.amt);if(!(a>0))return 'اكتب مبلغاً أكبر من صفر';x.item=v.item;x.amt=a;x.note=v.note.trim();ui.modal=null;changed('تم التعديل');}}); break;}
    case 'payfull': {const dd=S.debts.find(z=>z.id===d.id);const r=debtRow(dd,mi(ui.y,ui.m));const v=Math.min(r.remStart,r.paid+r.dueAfter);

    case 'editDebt': debtModal(S.debts.find(z=>z.id===d.id)); break;
    case 'download': {const t=exportJson();try{const blob=new Blob([t],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
        const n=new Date();a.download=`mizaniyati-${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();
        S.settings.lastBackup=Date.now();changed('تم تنزيل النسخة. إن لم يبدأ التنزيل استخدم «نسخ النص».');}catch(err){ui.showExport=true;ui.exportText=t;toast('التنزيل غير متاح هنا. انسخ النص بدلاً منه.');} break;}
    case 'copyJson': {const t=exportJson();ui.exportText=t;if(await copyText(t)){S.settings.lastBackup=Date.now();changed('تم نسخ النص. الصقه في ملاحظة أو رسالة لنفسك.');}else{ui.showExport=true;toast('حدّد النص وانسخه يدوياً');}break;}
    case 'showJson': ui.showExport=!ui.showExport; ui.exportText=exportJson(); render(); break;
    case 'markBackup': S.settings.lastBackup=Date.now(); changed('تم تسجيل النسخة'); break;
    case 'importCheck': {
      const txt=document.getElementById('i_txt').value.trim(); const f=document.getElementById('i_file').files[0];
      const handle=t=>{let o=null;try{o=sanitize(JSON.parse(t));}catch(err){}
        if(!o){ui.importPending=null;toast('النسخة غير صالحة أو ناقصة');return;}
        let nm=0;for(const y in o.years)nm+=Object.keys(o.years[y].months).length;
        ui.importPending={S:o,nm,debts:o.debts.length,planned:o.planned.length};render();};
      if(txt) handle(txt); else if(f){const fr=new FileReader();fr.onload=()=>handle(String(fr.result));fr.onerror=()=>toast('تعذّر قراءة الملف');fr.readAsText(f);} else toast('اختر ملفاً أو الصق النص');
      break;}
    case 'importDo': S=ui.importPending.S; ui.importPending=null; changed('تم استرجاع بياناتك'); break;
    case 'importCancel': ui.importPending=null; render(); break;
    case 'demo': S=demoState(NOW.getFullYear()); ui.y=NOW.getFullYear(); ui.m=1; ui.tab='month'; changed('تم تحميل بيانات تجريبية (فيها كلمة «مثال»)'); break;
    case 'wipe': {const pin=S.settings.pin;S=defState();S.settings.pin=pin;changed('تم مسح البيانات');break;}
  }
});
function debtModal(d){
  const yrs=[];for(let y=ui.y-1;y<=ui.y+2;y++)yrs.push({v:y,l:String(y)});
  const f=[{name:'name',label:'اسم الدين',value:d?d.name:'',required:true,ph:'مثال: سلفة من فلان'},
    {name:'type',label:'نوع السداد',type:'select',value:d?d.type:'inst',options:[{v:'inst',l:'أقساط شهرية'},{v:'cash',l:'كاش دفعة واحدة'}]},
    {name:'amount',label:'المبلغ الكلي',inputmode:'decimal',value:d?d.amount:'',required:true},
    {name:'n',label:'عدد الأشهر (للأقساط)',inputmode:'numeric',value:d?d.n:'',ph:'مثال: 3'},
    {name:'startM',label:'شهر البداية',type:'select',required:true,value:d&&d.startM?d.startM:'',options:[{v:'',l:'— اختر شهر البداية —'}].concat(MONTHS.map((m,k)=>({v:k+1,l:m})))},
    {name:'startY',label:'سنة البداية',type:'select',value:d?d.startY:ui.y,options:yrs},
    {name:'note',label:'ملاحظة',value:d?d.note:''}];
  openModal({title:d?'تعديل دين':'دين جديد',fields:f,note:'تُحسب الأقساط من شهر البداية، وما يتأخر ينتقل تلقائياً للشهر التالي.',
    extra:d?[{label:'حذف الدين',cls:'bad',confirm:true,fn:()=>{S.debts=S.debts.filter(z=>z.id!==d.id);ui.modal=null;changed('تم حذف الدين');}}]:[],
    onSubmit:v=>{const a=num(v.amount);if(!(a>0))return 'اكتب مبلغاً أكبر من صفر';if(!v.startM)return 'اختر شهر البداية';
      const n=v.type==='cash'?1:Math.max(1,Math.round(num(v.n)));if(v.type==='inst'&&!(num(v.n)>=1))return 'اكتب عدد الأشهر للأقساط';
      const o={name:v.name.trim(),type:v.type,amount:a,n,startM:+v.startM,startY:+v.startY,note:v.note.trim()};
      if(d)Object.assign(d,o);else S.debts.push(Object.assign({id:uid(),pay:{}},o));
      ui.modal=null;changed(d?'تم التعديل':'تمت إضافة الدين');}});
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const fd=Object.fromEntries(new FormData(f)); const kind=f.dataset.form;
  if(kind==='addExp'){const a=num(fd.amt);if(!(a>0)){toast('اكتب مبلغاً أكبر من صفر');return;}
    getMonth(S,ui.y,ui.m,true).log.push({id:uid(),item:fd.item,amt:a,note:String(fd.note||'').trim(),ts:Date.now()});ui.lastItem=fd.item;ui.focus='e_amt';changed('تمت الإضافة');}
  else if(kind==='pay'){const dd=S.debts.find(z=>z.id===f.dataset.id);const i=mi(ui.y,ui.m);const r=debtRow(dd,i);let a=String(fd.amt).trim()===''?0:num(fd.amt);
    const cap=r.remStart;if(a>cap+EPS){a=cap;toast('المبلغ أكبر من المتبقي، تم تعديله إلى '+fmt(cap));save();render();if(a>0)dd.pay[i]=r2(a);save();render();return;}
    if(a>0)dd.pay[i]=r2(a);else delete dd.pay[i];changed('تم حفظ السداد');}
  else if(kind==='addPl'){const nm=String(fd.name).trim();if(!nm)return;S.planned.push({id:uid(),name:nm,amt:Math.max(0,num(fd.amt)),note:String(fd.note||'').trim(),mi:mi(ui.y,ui.m),st:{}});changed('تمت الإضافة');}
  else if(kind==='settings'){S.settings.salary=Math.max(0,num(fd.salary));S.settings.items.forEach(it=>{const n=String(fd['n_'+it.id]||'').trim();if(n)it.name=n.slice(0,40);it.limit=Math.max(0,num(fd['l_'+it.id]));});changed('تم حفظ الإعدادات');}
  else if(kind==='pin'){
    if(S.settings.pin&&!(await checkPin(String(fd.old||''),S.settings.pin))){toast('الرمز الحالي غير صحيح');return;}
    const np=String(fd.pin||'').trim();
    if(np===''){S.settings.pin=null;changed(S.settings.pin===null?'تم إلغاء القفل':'');return;}
    if(!/^\d{4,}$/.test(np)){toast('الرمز أرقام فقط، 4 أو أكثر');return;}
    S.settings.pin=await hashPin(np);changed('تم تفعيل القفل');}
  else if(kind==='modal'){const r=ui.modal.onSubmit(fd);if(typeof r==='string'){toast(r);}}
  else if(kind==='unlock'){if(await checkPin(String(fd.pin||''),S.settings.pin)){ui.locked=false;ui.lockErr=false;render();}else{ui.lockErr=true;render();}}
});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();}
  else if(S.settings.pin&&hiddenAt&&Date.now()-hiddenAt>120000){ui.locked=true;ui.lockErr=false;render();}
});
/* ---------- boot ---------- */
S=load();
if(S.settings.pin) ui.locked=true;
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
render();

</script>
</body></html>
